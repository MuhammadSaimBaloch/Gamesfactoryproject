name: Deploy Cloudflare
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [staging, production]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GFP_D1_ID: ${{ vars.GFP_D1_ID }}
      GFP_D1_NAME: ${{ vars.GFP_D1_NAME }}
      GFP_R2_BUCKET: ${{ vars.GFP_R2_BUCKET }}
      GFP_SITE_URL: ${{ vars.GFP_SITE_URL }}
      GFP_ACCESS_ISSUER: ${{ vars.GFP_ACCESS_ISSUER }}
      GFP_ACCESS_AUD: ${{ vars.GFP_ACCESS_AUD }}
      GFP_ADMIN_EMAILS: ${{ vars.GFP_ADMIN_EMAILS }}
      GFP_TURNSTILE_SITE_KEY: ${{ vars.GFP_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: node scripts/deploy.mjs ${{ inputs.environment }}
